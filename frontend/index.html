<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Catalogue</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        form,
        .search-box {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        input,
        button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0052a3;
        }

        .btn-secondary {
            background: #555;
        }

        .btn-secondary:hover {
            background: #333;
        }

        .series-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .series-item:last-child {
            border-bottom: none;
        }

        .badge {
            background: #e0ecff;
            color: #0052a3;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-delete {
            background: #dc3545;
            padding: 6px 10px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

    <h1>🎬 Series Catalogue</h1>

    <!-- Registration Form (POST /series) -->
    <div class="card">
        <h2>Register New Series</h2>
        <form id="register-form">
            <input type="text" id="title" placeholder="Title (e.g. Dark)" required>
            <input type="text" id="genre" placeholder="Genre (e.g. Fiction)" required>
            <input type="number" id="year" placeholder="Year (e.g. 2017)" min="1901" required>
            <input type="number" id="seasons" placeholder="Seasons (e.g. 3)" min="1" required>
            <button type="submit">Register</button>
        </form>
        <p id="message"></p>
    </div>

    <!-- Search by Title (GET /series/{title}) -->
    <div class="card">
        <h2>Search Series</h2>
        <div class="search-box">
            <input type="text" id="search-title" placeholder="Enter the exact title...">
            <button type="button" onclick="searchSeries()">Search</button>
            <button type="button" class="btn-secondary" onclick="loadSeries()">Show All</button>
        </div>
    </div>

    <!-- Catalogue Listing (GET /series) -->
    <div class="card">
        <h2>Registered Series</h2>
        <div id="series-list">Loading...</div>
    </div>

    <script>
        const API_URL = "/series";

        // 1. List all series (GET /series)
        async function loadSeries() {
            const listEl = document.getElementById("series-list");
            try {
                const response = await fetch(API_URL);
                const series = await response.json();
                renderList(series);
            } catch (error) {
                listEl.innerHTML = "<p style='color:red;'>Error connecting to the API. Check that Uvicorn is running.</p>";
            }
        }

        // 2. Register new series (POST /series)
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById("message");

            const newSeries = {
                title: document.getElementById("title").value,
                genre: document.getElementById("genre").value,
                release_year: Number(document.getElementById("year").value),
                seasons: Number(document.getElementById("seasons").value)
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newSeries)
            });

            const data = await response.json();

            if (response.ok) {
                msgEl.style.color = "green";
                msgEl.textContent = data.message;
                e.target.reset();
                loadSeries();
            } else {
                msgEl.style.color = "red";
                msgEl.textContent = data.detail || "Error registering series.";
            }
        });

        // 3. Search for a specific series (GET /series/{title})
        async function searchSeries() {
            const title = document.getElementById("search-title").value.trim();
            if (!title) return loadSeries();

            const listEl = document.getElementById("series-list");
            const response = await fetch(`${API_URL}/${encodeURIComponent(title)}`);

            if (response.ok) {
                const series = await response.json();
                renderList([series]);
            } else {
                const error = await response.json();
                listEl.innerHTML = `<p style="color:red;">${error.detail}</p>`;
            }
        }

        // 4. Delete series (DELETE /series/{title})
        async function deleteSeries(title) {
            if (!confirm(`Are you sure you want to delete "${title}"?`)) return;

            const response = await fetch(`${API_URL}/${encodeURIComponent(title)}`, {
                method: "DELETE"
            });

            if (response.ok) {
                loadSeries(); // Refreshes the list on screen after deleting
            } else {
                const error = await response.json();
                alert(error.detail || "Error deleting the series.");
            }
        }

        // Helper function to draw the cards on screen
        function renderList(series) {
            const listEl = document.getElementById("series-list");
            if (series.length === 0) {
                listEl.innerHTML = "<p>No series registered yet.</p>";
                return;
            }

            listEl.innerHTML = series.map(s => `
        <div class="series-item">
          <div>
            <strong>${s.title}</strong> (${s.release_year})<br>
            <small>${s.seasons} season(s)</small>
          </div>
          <div class="actions">
            <span class="badge">${s.genre}</span>
            <button type="button" class="btn-delete" onclick="deleteSeries('${s.title.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </div>
      `).join("");
        }

        // Loads the catalogue automatically when the page opens
        loadSeries();
    </script>
</body>

</html>
