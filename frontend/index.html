<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Catalogue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f6f3ec;
            --ink: #1c1b19;
            --muted: #75705f;
            --rule: #d8d1c2;
            --accent: #a8321f;
            --ok: #3d6b35;
            --serif: "Fraunces", Georgia, serif;
            --sans: "IBM Plex Sans", system-ui, sans-serif;
            --mono: "IBM Plex Mono", ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.5;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 56px 20px 80px;
        }

        header {
            border-bottom: 2px solid var(--ink);
            padding-bottom: 14px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
        }

        h1 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 44px;
            line-height: 1;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .count {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        section {
            margin-bottom: 44px;
        }

        h2 {
            font-family: var(--mono);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin: 0 0 14px;
        }

        form,
        .search-box {
            display: grid;
            gap: 14px 18px;
            align-items: end;
        }

        form {
            grid-template-columns: 2fr 1.5fr 1fr 1fr auto;
        }

        .search-box {
            grid-template-columns: 1fr auto auto;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        input {
            font: inherit;
            color: var(--ink);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--rule);
            border-radius: 0;
            padding: 6px 0;
            width: 100%;
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--ink);
        }

        input::placeholder {
            color: #b0a998;
        }

        button {
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--ink);
            border-radius: 2px;
            padding: 7px 16px;
            background: var(--ink);
            color: var(--paper);
        }

        button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
        }

        .btn-secondary:hover {
            background: transparent;
            color: var(--accent);
        }

        #message {
            margin: 12px 0 0;
            font-size: 14px;
            min-height: 1.5em;
        }

        .series-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border-top: 1px solid var(--rule);
        }

        .series-item {
            display: grid;
            grid-template-columns: 2.5em 1fr auto auto;
            align-items: baseline;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--rule);
        }

        .series-index,
        .series-year {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--muted);
        }

        .series-title {
            font-family: var(--serif);
            font-size: 21px;
            line-height: 1.2;
        }

        .series-meta {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }

        .btn-delete {
            background: none;
            border: none;
            padding: 0;
            font-size: 13px;
            color: var(--muted);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .btn-delete:hover {
            background: none;
            color: var(--accent);
        }

        .empty,
        .error {
            padding: 14px 0;
            margin: 0;
            color: var(--muted);
        }

        .error {
            color: var(--accent);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 34px;
            }

            form {
                grid-template-columns: 1fr 1fr;
            }

            form label:first-child {
                grid-column: 1 / -1;
            }

            .search-box {
                grid-template-columns: 1fr 1fr;
            }

            .search-box input {
                grid-column: 1 / -1;
            }

            .series-item {
                grid-template-columns: 2em 1fr auto;
            }

            .series-year {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Series Catalogue</h1>
            <span class="count" id="series-count"></span>
        </header>

        <!-- Registration Form (POST /series) -->
        <section>
            <h2>Register New Series</h2>
            <form id="register-form">
                <label>Title
                    <input type="text" id="title" placeholder="Dark" required>
                </label>
                <label>Genre
                    <input type="text" id="genre" placeholder="Fiction" required>
                </label>
                <label>Year
                    <input type="number" id="year" placeholder="2017" min="1901" required>
                </label>
                <label>Seasons
                    <input type="number" id="seasons" placeholder="3" min="1" required>
                </label>
                <button type="submit">Register</button>
            </form>
            <p id="message"></p>
        </section>

        <!-- Search by Title (GET /series/{title}) -->
        <section>
            <h2>Search Series</h2>
            <div class="search-box">
                <input type="text" id="search-title" placeholder="Enter the exact title..." aria-label="Series title">
                <button type="button" onclick="searchSeries()">Search</button>
                <button type="button" class="btn-secondary" onclick="loadSeries()">Show All</button>
            </div>
        </section>

        <!-- Catalogue Listing (GET /series) -->
        <section>
            <h2>Registered Series</h2>
            <div id="series-list"><p class="empty">Loading...</p></div>
        </section>
    </main>

    <script>
        const API_URL = "/series";

        // 1. List all series (GET /series)
        async function loadSeries() {
            const listEl = document.getElementById("series-list");
            try {
                const response = await fetch(API_URL);
                const series = await response.json();
                renderList(series);
                document.getElementById("series-count").textContent =
                    `${series.length} ${series.length === 1 ? "title" : "titles"}`;
            } catch (error) {
                listEl.innerHTML = "<p class='error'>Error connecting to the API. Check that Uvicorn is running.</p>";
            }
        }

        // 2. Register new series (POST /series)
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById("message");

            const newSeries = {
                title: document.getElementById("title").value,
                genre: document.getElementById("genre").value,
                release_year: Number(document.getElementById("year").value),
                seasons: Number(document.getElementById("seasons").value)
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newSeries)
            });

            const data = await response.json();

            if (response.ok) {
                msgEl.style.color = "var(--ok)";
                msgEl.textContent = data.message;
                e.target.reset();
                loadSeries();
            } else {
                msgEl.style.color = "var(--accent)";
                msgEl.textContent = data.detail || "Error registering series.";
            }
        });

        // 3. Search for a specific series (GET /series/{title})
        async function searchSeries() {
            const title = document.getElementById("search-title").value.trim();
            if (!title) return loadSeries();

            const listEl = document.getElementById("series-list");
            const response = await fetch(`${API_URL}/${encodeURIComponent(title)}`);

            if (response.ok) {
                const series = await response.json();
                renderList([series]);
            } else {
                const error = await response.json();
                listEl.innerHTML = `<p class="error">${error.detail}</p>`;
            }
        }

        // 4. Delete series (DELETE /series/{title})
        async function deleteSeries(title) {
            if (!confirm(`Are you sure you want to delete "${title}"?`)) return;

            const response = await fetch(`${API_URL}/${encodeURIComponent(title)}`, {
                method: "DELETE"
            });

            if (response.ok) {
                loadSeries(); // Refreshes the list on screen after deleting
            } else {
                const error = await response.json();
                alert(error.detail || "Error deleting the series.");
            }
        }

        // Helper function to draw the list on screen
        function renderList(series) {
            const listEl = document.getElementById("series-list");
            if (series.length === 0) {
                listEl.innerHTML = "<p class='empty'>No series registered yet.</p>";
                return;
            }

            listEl.innerHTML = `<ol class="series-list">${series.map((s, i) => `
                <li class="series-item">
                    <span class="series-index">${String(i + 1).padStart(2, "0")}</span>
                    <div>
                        <span class="series-title">${s.title}</span>
                        <span class="series-meta">${s.genre} · ${s.seasons} ${s.seasons === 1 ? "season" : "seasons"}</span>
                    </div>
                    <span class="series-year">${s.release_year}</span>
                    <button type="button" class="btn-delete" onclick="deleteSeries('${s.title.replace(/'/g, "\\'")}')">Delete</button>
                </li>
            `).join("")}</ol>`;
        }

        // Loads the catalogue automatically when the page opens
        loadSeries();
    </script>
</body>

</html>
